name: Weekly Intel Pipeline

on:
  schedule:
    # Sunday 08:00 Israel time (05:00 UTC), after Firecrawl monitors (06:00 IST)
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      skip_crawl:
        description: "Skip the crawl step (use existing snapshots)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  weekly-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run weekly pipeline
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ inputs.skip_crawl }}" = "true" ]; then
            python -m src.weekly_run --skip-crawl
          else
            python -m src.weekly_run
          fi

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "01 - Weekly Digests/" "07 - Questions to Validate/" "90 - Raw Snapshots/"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly intel update: $(date +%Y-%m-%d)"
            git push
          fi
