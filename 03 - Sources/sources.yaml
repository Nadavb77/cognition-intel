sources:
  # All sources use Firecrawl Monitoring mode.
  # Schedule: Sunday 06:00 Israel time (Asia/Jerusalem).
  # monitor_id values were populated by: python -m src.setup_monitors create

  - name: devin-docs
    url: https://docs.devin.ai
    mode: monitor
    crawl_method: firecrawl
    description: Official Devin documentation
    tags: [devin, cognition, docs]
    monitor_id: 019e9ca2-846b-7045-94d8-2ace1eb9c2f5
    monitor:
      target_type: crawl
      schedule:
        cron: "0 6 * * 0"
        timezone: Asia/Jerusalem
      goal: >-
        Track changes to Devin documentation including new features,
        API changes, deployment instructions, pricing, security,
        and integration updates. Ignore minor wording or formatting fixes.
      crawl_limit: 100
      max_discovery_depth: 3
      notification: none

  - name: cognition-blog
    url: https://cognition.ai/blog
    mode: monitor
    crawl_method: firecrawl
    description: Cognition company blog
    tags: [cognition, blog]
    monitor_id: 019e9ca2-877a-731e-aff1-a9845649502c
    monitor:
      target_type: scrape
      schedule:
        cron: "0 6 * * 0"
        timezone: Asia/Jerusalem
      goal: >-
        Alert when a new blog post is published or existing posts
        are significantly updated. Track product announcements,
        company news, and competitive positioning. Ignore minor edits.
      notification: none

  - name: devin-release-notes
    url: https://docs.devin.ai/changelog
    mode: monitor
    crawl_method: firecrawl
    description: Devin changelog and release notes
    tags: [devin, releases]
    monitor_id: 019e9ca5-390e-734e-8026-6b029b957969
    monitor:
      target_type: scrape
      schedule:
        cron: "0 6 * * 0"
        timezone: Asia/Jerusalem
      goal: >-
        Alert when new release notes or changelog entries appear.
        Track new features, bug fixes, breaking changes, and
        deprecations. Ignore formatting-only updates.
      notification: none

